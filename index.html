<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Finanças 💼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .tab-btn { transition: all 0.3s ease; }
        .tab-btn.active { background: #3b82f6; color: white; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: #1e293b; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: white; margin-bottom: 10px; }
        .status-pago { color: #10b981; font-weight: 600; }
        .status-vencer { color: #f59e0b; font-weight: 600; }
        .status-atrasado { color: #ef4444; font-weight: 600; }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #334155; flex-wrap: wrap; gap: 8px; }
        .hidden-tab { display: none; }
        .sync-indicator { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-2xl font-bold text-center mb-6">💼 Controle de Finanças</h1>
    <p class="text-center sync-indicator" id="syncStatus">🔄 Conectando...</p>

    <!-- Abas -->
    <div class="flex flex-wrap gap-2 mb-6 justify-center">
        <button class="tab-btn active btn" onclick="showTab('resumo')">📊 Resumo</button>
        <button class="tab-btn btn" onclick="showTab('boletos')">📄 Boletos</button>
        <button class="tab-btn btn" onclick="showTab('cheques')">✍️ Cheques</button>
        <button class="tab-btn btn" onclick="showTab('rendas')">💰 Rendas</button>
        <button class="tab-btn btn" onclick="showTab('patrimonio')">🚗 Patrimônio</button>
    </div>

    <!-- ABA RESUMO -->
    <div id="tab-resumo" class="card">
        <h2 class="text-xl font-semibold mb-4">📊 Visão Geral</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="text-center p-4 bg-blue-900/30 rounded-lg">
                <p class="text-sm text-gray-400">A Vencer</p>
                <p class="text-xl font-bold text-blue-400" id="resumoVencer">R$ 0,00</p>
            </div>
            <div class="text-center p-4 bg-yellow-900/30 rounded-lg">
                <p class="text-sm text-gray-400">A Vencer (30d)</p>
                <p class="text-xl font-bold text-yellow-400" id="resumoProximos">R$ 0,00</p>
            </div>
            <div class="text-center p-4 bg-red-900/30 rounded-lg">
                <p class="text-sm text-gray-400">Atrasados</p>
                <p class="text-xl font-bold text-red-400" id="resumoAtrasado">R$ 0,00</p>
            </div>
            <div class="text-center p-4 bg-green-900/30 rounded-lg">
                <p class="text-sm text-gray-400">Total Pago</p>
                <p class="text-xl font-bold text-green-400" id="resumoPago">R$ 0,00</p>
            </div>
        </div>
        <div style="height: 250px;">
            <canvas id="graficoResumo"></canvas>
        </div>
    </div>

    <!-- ABA BOLETOS -->
    <div id="tab-boletos" class="card hidden-tab">
        <h2 class="text-xl font-semibold mb-4">📄 Controle de Boletos</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label>Nome / Empresa</label>
                <input type="text" id="boletoNome" placeholder="Ex: Energia, Aluguel...">
                <label>Código de Barras</label>
                <input type="text" id="boletoCodigo" placeholder="Digite o código de barras">
            </div>
            <div>
                <label>Valor R$</label>
                <input type="number" step="0.01" id="boletoValor" placeholder="0,00">
                <label>Data de Vencimento</label>
                <input type="date" id="boletoData">
            </div>
        </div>
        <button class="btn btn-primary w-full mb-6" onclick="adicionarBoleto()">➕ Adicionar Boleto</button>

        <h3 class="font-semibold mb-2">🔍 Filtrar por Status:</h3>
        <div class="flex gap-2 mb-4 flex-wrap">
            <button class="btn btn-primary" onclick="filtrarBoletos('todos')">Todos</button>
            <button class="btn btn-warning" onclick="filtrarBoletos('a vencer')">A Vencer</button>
            <button class="btn btn-danger" onclick="filtrarBoletos('atrasado')">Atrasados</button>
            <button class="btn btn-success" onclick="filtrarBoletos('pago')">Pagos</button>
        </div>

        <div id="listaBoletos"></div>
    </div>

    <!-- ABA CHEQUES -->
    <div id="tab-cheques" class="card hidden-tab">
        <h2 class="text-xl font-semibold mb-4">✍️ Controle de Cheques</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label>Nome / Destinatário</label>
                <input type="text" id="chequeNome" placeholder="Ex: Fornecedor X">
                <label>Número do Cheque</label>
                <input type="text" id="chequeNumero" placeholder="000.000.000">
            </div>
            <div>
                <label>Valor R$</label>
                <input type="number" step="0.01" id="chequeValor" placeholder="0,00">
                <label>Data de Emissão</label>
                <input type="date" id="chequeData">
            </div>
        </div>
        <button class="btn btn-primary w-full mb-6" onclick="adicionarCheque()">➕ Adicionar Cheque</button>
        <div id="listaCheques"></div>
    </div>

    <!-- ABA RENDAS -->
    <div id="tab-rendas" class="card hidden-tab">
        <h2 class="text-xl font-semibold mb-4">💰 Rendas e Recebíveis</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label>Origem / Descrição</label>
                <input type="text" id="rendaNome" placeholder="Ex: Aluguel da casa, Royalties...">
                <label>Valor R$</label>
                <input type="number" step="0.01" id="rendaValor" placeholder="0,00">
            </div>
            <div>
                <label>Data Prevista</label>
                <input type="date" id="rendaData">
                <label>Tipo</label>
                <select id="rendaTipo">
                    <option value="mensal">Mensal</option>
                    <option value="unica">Receita Única</option>
                    <option value="anual">Anual</option>
                </select>
            </div>
        </div>
        <button class="btn btn-primary w-full mb-6" onclick="adicionarRenda()">➕ Adicionar Renda</button>
        <div id="listaRendas"></div>
    </div>

    <!-- ABA PATRIMÔNIO -->
    <div id="tab-patrimonio" class="card hidden-tab">
        <h2 class="text-xl font-semibold mb-4">🚗 Meu Patrimônio</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label>Item / Descrição</label>
                <input type="text" id="patrimonioNome" placeholder="Ex: Casa, Carro, Terreno...">
                <label>Valor Estimado R$</label>
                <input type="number" step="0.01" id="patrimonioValor" placeholder="0,00">
            </div>
            <div>
                <label>Localização / Observação</label>
                <input type="text" id="patrimonioObs" placeholder="Ex: Brasília - DF">
                <label>Tipo</label>
                <select id="patrimonioTipo">
                    <option value="imovel">Imóvel</option>
                    <option value="veiculo">Veículo</option>
                    <option value="investimento">Investimento</option>
                    <option value="outro">Outro</option>
                </select>
            </div>
        </div>
        <button class="btn btn-primary w-full mb-6" onclick="adicionarPatrimonio()">➕ Adicionar Item</button>
        <div id="listaPatrimonio"></div>
    </div>

</div>

<script>
// ==========================================
// FIREBASE CONFIGURAÇÃO — JÁ PREENCHIDO ✅
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyCPd_aIQVDEP-UK-N2twGzci8sRLgJTRmI",
  authDomain: "controle-59fff.firebaseapp.com",
  projectId: "controle-59fff",
  storageBucket: "controle-59fff.appspot.com",
  messagingSenderId: "597330115962",
  appId: "1:597330115962:web:0d01a891a5745f809e6ac3",
  measurementId: "G-WZ3C45QL6H"
};

// Inicializar Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Coleções
const boletosRef = db.collection('boletos');
const chequesRef = db.collection('cheques');
const rendasRef = db.collection('rendas');
const patrimonioRef = db.collection('patrimonio');

// Estado
let boletos = [];
let cheques = [];
let rendas = [];
let patrimonio = [];
let filtroAtual = 'todos';
let grafico = null;

// Formatar moeda
function formatarValor(valor) {
    return Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Formatar data
function formatarData(dataStr) {
    if (!dataStr) return '--';
    const [ano, mes, dia] = dataStr.split('-');
    return `${dia}/${mes}/${ano}`;
}

// Hoje
function hoje() {
    return new Date().toISOString().split('T')[0];
}

function ehAtrasado(dataStr) {
    return dataStr < hoje();
}

function ehProximos30Dias(dataStr) {
    const data = new Date(dataStr);
    const agora = new Date();
    const trintaDias = new Date();
    trintaDias.setDate(trintaDias.getDate() + 30);
    return data >= agora && data <= trintaDias;
}

// ==========================================
// CARREGAR DADOS DO FIREBASE
// ==========================================
async function carregarDados() {
    try {
        document.getElementById('syncStatus').textContent = '🔄 Carregando...';
        
        const snapBoletos = await boletosRef.orderBy('data', 'asc').get();
        boletos = snapBoletos.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        const snapCheques = await chequesRef.orderBy('data', 'asc').get();
        cheques = snapCheques.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        const snapRendas = await rendasRef.orderBy('data', 'asc').get();
        rendas = snapRendas.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        const snapPatrimonio = await patrimonioRef.get();
        patrimonio = snapPatrimonio.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        document.getElementById('syncStatus').innerHTML = '✅ Sincronizado na nuvem';
        atualizarTudo();
    } catch (error) {
        console.error('Erro ao carregar:', error);
        document.getElementById('syncStatus').innerHTML = '⚠️ Erro de conexão — verifique o Firebase';
    }
}

// ==========================================
// BOLETOS
// ==========================================
async function adicionarBoleto() {
    const nome = document.getElementById('boletoNome').value.trim();
    const codigo = document.getElementById('boletoCodigo').value.trim();
    const valor = parseFloat(document.getElementById('boletoValor').value || 0);
    const data = document.getElementById('boletoData').value;

    if (!nome || !valor || !data) { alert('Preencha nome, valor e data!'); return; }

    const novo = { nome, codigo, valor, data, status: ehAtrasado(data) ? 'atrasado' : 'a vencer' };
    await boletosRef.add(novo);
    
    limparCamposBoletos();
    await carregarDados();
}

function limparCamposBoletos() {
    document.getElementById('boletoNome').value = '';
    document.getElementById('boletoCodigo').value = '';
    document.getElementById('boletoValor').value = '';
    document.getElementById('boletoData').value = '';
}

async function mudarStatusBoleto(id, atual) {
    const proximos = { 'a vencer': 'pago', 'atrasado': 'pago', 'pago': 'a vencer' };
    const novo = proximos[atual];
    await boletosRef.doc(id).update({ status: novo });
    await carregarDados();
}

async function excluirBoleto(id) {
    if (confirm('Tem certeza que quer excluir este boleto?')) {
        await boletosRef.doc(id).delete();
        await carregarDados();
    }
}

function filtrarBoletos(filtro) {
    filtroAtual = filtro;
    renderizarBoletos();
}

function renderizarBoletos() {
    const lista = document.getElementById('listaBoletos');
    let filtrados = boletos;
    
    if (filtroAtual !== 'todos') {
        filtrados = boletos.filter(b => b.status === filtroAtual);
    }

    if (filtrados.length === 0) {
        lista.innerHTML = '<p class="text-gray-400 text-center py-4">Nenhum boleto encontrado.</p>';
        return;
    }

    lista.innerHTML = filtrados.map(b => {
        let classeStatus = '';
        let textoStatus = b.status;
        if (b.status === 'a vencer') { classeStatus = 'status-vencer'; textoStatus = '📅 A Vencer'; }
        else if (b.status === 'atrasado') { classeStatus = 'status-atrasado'; textoStatus = '⚠️ Atrasado'; }
        else if (b.status === 'pago') { classeStatus = 'status-pago'; textoStatus = '✅ Pago'; }

        return `
        <div class="item-row">
            <div class="flex-1 min-w-[200px]">
                <strong>${b.nome}</strong>
                ${b.codigo ? `<br><small class="text-gray-400">Cód: ${b.codigo}</small>` : ''}
                <br><small class="text-gray-400">Venc: ${formatarData(b.data)}</small>
            </div>
            <div class="text-right">
                <p class="font-bold text-lg">R$ ${formatarValor(b.valor)}</p>
                <span class="${classeStatus} text-sm">${textoStatus}</span>
            </div>
            <div class="flex gap-1 mt-2 w-full md:w-auto">
                <button class="btn btn-success text-sm py-1 px-2" onclick="mudarStatusBoleto('${b.id}', '${b.status}')">✓</button>
                <button class="btn btn-danger text-sm py-1 px-2" onclick="excluirBoleto('${b.id}')">🗑️</button>
            </div>
        </div>`;
    }).join('');
}

// ==========================================
// CHEQUES
// ==========================================
async function adicionarCheque() {
    const nome = document.getElementById('chequeNome').value.trim();
    const numero = document.getElementById('chequeNumero').value.trim();
    const valor = parseFloat(document.getElementById('chequeValor').value || 0);
    const data = document.getElementById('chequeData').value;

    if (!nome || !valor || !data) { alert('Preencha nome, valor e data!'); return; }

    await chequesRef.add({ nome, numero, valor, data });
    limparCamposCheques();
    await carregarDados();
}

function limparCamposCheques() {
    document.getElementById('chequeNome').value = '';
    document.getElementById('chequeNumero').value = '';
    document.getElementById('chequeValor').value = '';
    document.getElementById('chequeData').value = '';
}

async function excluirCheque(id) {
    if (confirm('Excluir este cheque?')) {
        await chequesRef.doc(id).delete();
        await carregarDados();
    }
}

function renderizarCheques() {
    const lista = document.getElementById('listaCheques');
    if (cheques.length === 0) {
        lista.innerHTML = '<p class="text-gray-400 text-center py-4">Nenhum cheque cadastrado.</p>';
        return;
    }

    lista.innerHTML = cheques.map(c => `
    <div class="item-row">
        <div class="flex-1">
            <strong>${c.nome}</strong>
            ${c.numero ? `<br><small class="text-gray-400">Nº: ${c.numero}</small>` : ''}
            <br><small class="text-gray-400">Emissão: ${formatarData(c.data)}</small>
        </div>
        <p class="font-bold text-lg">R$ ${formatarValor(c.valor)}</p>
        <button class="btn btn-danger text-sm py-1 px-2" onclick="excluirCheque('${c.id}')">🗑️</button>
    </div>`).join('');
}

// ==========================================
// RENDAS
// ==========================================
async function adicionarRenda() {
    const nome = document.getElementById('rendaNome').value.trim();
    const valor = parseFloat(document.getElementById('rendaValor').value || 0);
    const data = document.getElementById('rendaData').value;
    const tipo = document.getElementById('rendaTipo').value;

    if (!nome || !valor || !data) { alert('Preencha todos os campos!'); return; }

    await rendasRef.add({ nome, valor, data, tipo });
    limparCamposRendas();
    await carregarDados();
}

function limparCamposRendas() {
    document.getElementById('rendaNome').value = '';
    document.getElementById('rendaValor').value = '';
    document.getElementById('rendaData').value = '';
}

async function excluirRenda(id) {
    if (confirm('Excluir esta renda?')) {
        await rendasRef.doc(id).delete();
        await carregarDados();
    }
}

function renderizarRendas() {
    const lista = document.getElementById('listaRendas');
    if (rendas.length === 0) {
        lista.innerHTML = '<p class="text-gray-400 text-center py-4">Nenhuma renda cadastrada.</p>';
        return;
    }

    lista.innerHTML = rendas.map(r => `
    <div class="item-row">
        <div class="flex-1">
            <strong>${r.nome}</strong>
            <br><small class="text-gray-400">Data: ${formatarData(r.data)} | Tipo: ${r.tipo}</small>
        </div>
        <p class="font-bold text-lg text-green-400">+ R$ ${formatarValor(r.valor)}</p>
        <button class="btn btn-danger text-sm py-1 px-2" onclick="excluirRenda('${r.id}')">🗑️</button>
    </div>`).join('');
}

// ==========================================
// PATRIMÔNIO
// ==========================================
async function adicionarPatrimonio() {
    const nome = document.getElementById('patrimonioNome').value.trim();
    const valor = parseFloat(document.getElementById('patrimonioValor').value || 0);
    const obs = document.getElementById('patrimonioObs').value.trim();
    const tipo = document.getElementById('patrimonioTipo').value;

    if (!nome || !valor) { alert('Preencha nome e valor!'); return; }

    await patrimonioRef.add({ nome, valor, obs, tipo });
    limparCamposPatrimonio();
    await carregarDados();
}

function limparCamposPatrimonio() {
    document.getElementById('patrimonioNome').value = '';
    document.getElementById('patrimonioValor').value = '';
    document.getElementById('patrimonioObs').value = '';
}

async function excluirPatrimonio(id) {
    if (confirm('Excluir este item do patrimônio?')) {
        await patrimonioRef.doc(id).delete();
        await carregarDados();
    }
}

function renderizarPatrimonio() {
    const lista = document.getElementById('listaPatrimonio');
    if (patrimonio.length === 0) {
        lista.innerHTML = '<p class="text-gray-400 text-center py-4">Nenhum item cadastrado.</p>';
        return;
    }

    const total = patrimonio.reduce((s, p) => s + Number(p.valor), 0);

    lista.innerHTML = `
    <div class="mb-4 p-3 bg-green-900/30 rounded-lg text-center">
        <strong>💰 Valor Total do Patrimônio:</strong>
        <span class="text-xl font-bold text-green-400"> R$ ${formatarValor(total)}</span>
    </div>
    ${patrimonio.map(p => `
    <div class="item-row">
        <div class="flex-1">
            <strong>${p.nome}</strong>
            <br><small class="text-gray-400">${p.tipo}${p.obs ? ` | ${p.obs}` : ''}</small>
        </div>
        <p class="font-bold text-lg">R$ ${formatarValor(p.valor)}</p>
        <button class="btn btn-danger text-sm py-1 px-2" onclick="excluirPatrimonio('${p.id}')">🗑️</button>
    </div>`).join('')}`;
}

// ==========================================
// ABA E RESUMO
// ==========================================
function showTab(nome) {
    document.querySelectorAll('[id^="tab-"]').forEach(tab => tab.classList.add('hidden-tab'));
    document.getElementById(`tab-${nome}`).classList.remove('hidden-tab');
    
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    if (nome === 'boletos') renderizarBoletos();
    if (nome === 'cheques') renderizarCheques();
    if (nome === 'rendas') renderizarRendas();
    if (nome === 'patrimonio') renderizarPatrimonio();
    if (nome === 'resumo') atualizarResumo();
}

function atualizarResumo() {
    const vencer = boletos.filter(b => b.status === 'a vencer').reduce((s, b) => s + Number(b.valor), 0);
    const proximos = boletos.filter(b => b.status === 'a vencer' && ehProximos30Dias(b.data)).reduce((s, b) => s + Number(b.valor), 0);
    const atrasado = boletos.filter(b => b.status === 'atrasado').reduce((s, b) => s + Number(b.valor), 0);
    const pago = boletos.filter(b => b.status === 'pago').reduce((s, b) => s + Number(b.valor), 0);

    document.getElementById('resumoVencer').textContent = `R$ ${formatarValor(vencer)}`;
    document.getElementById('resumoProximos').textContent = `R$ ${formatarValor(proximos)}`;
    document.getElementById('resumoAtrasado').textContent = `R$ ${formatarValor(atrasado)}`;
    document.getElementById('resumoPago').textContent = `R$ ${formatarValor(pago)}`;

    atualizarGrafico(vencer, proximos, atrasado, pago);
}

function atualizarGrafico(vencer, proximos, atrasado, pago) {
    const ctx = document.getElementById('graficoResumo').getContext('2d');
    if (grafico) grafico.destroy();
    
    grafico = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['A Vencer', 'Próximos 30d', 'Atrasados', 'Pagos'],
            datasets: [{
                data: [vencer, proximos, atrasado, pago],
                backgroundColor: ['#3b82f6', '#f59e0b', '#ef4444', '#10b981'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { color: '#f1f5f9', font: { size: 12 } } }
            }
        }
    });
}

function atualizarTudo() {
    renderizarBoletos();
    renderizarCheques();
    renderizarRendas();
    renderizarPatrimonio();
    atualizarResumo();
}
