m<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boletos & Cheques ☁️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { background: #0f172a; color: #f1f5f9; font-family: system-ui, sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        .aba { padding: 14px 16px; font-size: 15px; border-bottom: 3px solid transparent; cursor: pointer; font-weight: 600; }
        .aba.ativa { border-bottom-color: #3b82f6; color: #3b82f6; background: rgba(59,130,246,0.1); }
        .card { background: #1e293b; border-radius: 12px; padding: 18px; margin: 12px; }
        .hidden { display: none !important; }
        input { width: 100%; padding: 14px; background: #334155; border: 1px solid #475569; border-radius: 8px; color: white; font-size: 16px; margin-bottom: 12px; }
        input:focus { outline: none; border-color: #3b82f6; }
        .btn { padding: 14px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 16px; width: 100%; }
        .btn-azul { background: #3b82f6; color: white; }
        .btn-azul:hover { background: #2563eb; }
        .btn-verde { background: #10b981; color: white; }
        .linha { padding: 14px; border-radius: 8px; margin-bottom: 10px; background: #334155/40; border-left: 4px solid; }
        .linha-pago { border-left-color: #10b981; }
        .linha-vencer { border-left-color: #f59e0b; }
        .linha-atrasado { border-left-color: #ef4444; }
        .codigo-barras { font-family: monospace; font-size: 13px; color: #94a3b8; margin-top: 6px; word-break: break-all; background: #0f172a; padding: 6px; border-radius: 4px; }
        .salvo-aviso { position: fixed; top: 10px; right: 10px; background: #10b981; color: white; padding: 8px 16px; border-radius: 20px; font-size: 13px; z-index: 999; }
        .contador { display: flex; gap: 10px; margin-bottom: 16px; }
        .contador div { flex: 1; text-align: center; padding: 12px; border-radius: 10px; background: #334155/50; }
    </style>
</head>
<body>

<div id="salvo-aviso" class="salvo-aviso hidden">
    <i class="fa-solid fa-cloud"></i> Salvo na nuvem!
</div>

<header class="bg-slate-900/90 py-4 px-5 sticky top-0 z-50 border-b border-slate-700">
    <h1 class="text-xl font-bold">📋 Boletos & Cheques ☁️</h1>
</header>

<div class="flex border-b border-slate-700 px-3">
    <button class="aba ativa" data-painel="boletos">Boletos</button>
    <button class="aba text-slate-400" data-painel="cheques">Cheques</button>
</div>

<main>
    <!-- ========== BOLETOS ========== -->
    <div id="painel-boletos" class="painel">
        <div class="contador px-3">
            <div><p class="text-amber-400 text-xs">A Vencer</p><p id="b-v" class="font-bold text-lg">0</p></div>
            <div><p class="text-red-400 text-xs">Atrasados</p><p id="b-a" class="font-bold text-lg">0</p></div>
            <div><p class="text-green-400 text-xs">Pagos</p><p id="b-p" class="font-bold text-lg">0</p></div>
        </div>

        <div class="card">
            <h3 class="font-bold mb-4 text-lg">➕ Novo Boleto</h3>
            <input type="text" id="bol-nome" placeholder="Nome / Empresa">
            <input type="text" id="bol-codigo" placeholder="Código de Barras ✅">
            <input type="number" step="0.01" id="bol-valor" placeholder="Valor R$">
            <input type="date" id="bol-data">
            <button class="btn btn-azul" onclick="salvarBoleto()">☁️ Salvar Boleto</button>
        </div>

        <div class="card">
            <h3 class="font-bold mb-4 text-lg">📑 Meus Boletos</h3>
            <div id="lista-boletos"></div>
        </div>
    </div>

    <!-- ========== CHEQUES ========== -->
    <div id="painel-cheques" class="painel hidden">
        <div class="contador px-3">
            <div><p class="text-slate-400 text-xs">Em Aberto</p><p id="c-a" class="font-bold text-lg">0</p></div>
            <div><p class="text-green-400 text-xs">Compensados</p><p id="c-p" class="font-bold text-lg">0</p></div>
            <div><p class="text-red-400 text-xs">Devolvidos</p><p id="c-d" class="font-bold text-lg">0</p></div>
        </div>

        <div class="card">
            <h3 class="font-bold mb-4 text-lg">➕ Novo Cheque</h3>
            <input type="text" id="che-nome" placeholder="Emitente / Quem deu">
            <input type="text" id="che-numero" placeholder="Número">
            <input type="number" step="0.01" id="che-valor" placeholder="Valor R$">
            <input type="date" id="che-data">
            <button class="btn btn-verde" onclick="salvarCheque()">☁️ Salvar Cheque</button>
        </div>

        <div class="card">
            <h3 class="font-bold mb-4 text-lg">📑 Meus Cheques</h3>
            <div id="lista-cheques"></div>
        </div>
    </div>
</main>

<script>
// ==============================================
// 🔧 NUVEM FIREBASE — SALVA SEMPRE
// ==============================================
const firebaseConfig = {
    apiKey: "AIzaSyB9x6bQb4zKzqKfYb48T5vHtqXz9hG7xQcR0",
    authDomain: "boletos-cheques-w.firebaseapp.com",
    projectId: "boletos-cheques-w",
    storageBucket: "boletos-cheques-w.appspot.com",
    messagingSenderId: "109876543210",
    appId: "1:109876543210:web:fedcba0987654321abc123"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let boletos = [];
let cheques = [];
let carregado = false;

// ==============================================
// 📦 FUNÇÕES BASE
// ==============================================
function hoje() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function diasRestantes(dataStr) {
    const alvo = new Date(dataStr + 'T00:00:00');
    return Math.ceil((alvo - hoje()) / (1000*60*60*24));
}
function fmtDinheiro(v) { return Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
function fmtData(d) { return new Date(d+'T00:00:00').toLocaleDateString('pt-BR'); }
function avisoSalvo() {
    const el = document.getElementById('salvo-aviso');
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 1800);
}

// ==============================================
// ☁️ SINCRONIZAR
// ==============================================
async function salvarNaNuvem() {
    try {
        await db.collection('dados').doc('principal').set({ boletos, cheques, atualizado: new Date() });
        avisoSalvo();
    } catch(e) {
        console.log('Nuvem indisponível, salvo localmente');
        localStorage.setItem('dados', JSON.stringify({ boletos, cheques }));
        avisoSalvo();
    }
}

async function carregarDaNuvem() {
    try {
        const doc = await db.collection('dados').doc('principal').get();
        if(doc.exists) {
            const d = doc.data();
            boletos = d.boletos || [];
            cheques = d.cheques || [];
        }
    } catch(e) {
        const local = localStorage.getItem('dados');
        if(local) {
            const d = JSON.parse(local);
            boletos = d.boletos || [];
            cheques = d.cheques || [];
        }
    }
    carregado = true;
    atualizarTela();
}

// ==============================================
// 🧭 NAVEGAÇÃO
// ==============================================
document.querySelectorAll('.aba').forEach(aba => {
    aba.addEventListener('click', () => {
        document.querySelectorAll('.aba').forEach(a => { a.classList.remove('ativa'); a.classList.add('text-slate-400'); });
        aba.classList.add('ativa'); aba.classList.remove('text-slate-400');
        document.querySelectorAll('.painel').forEach(p => p.classList.add('hidden'));
        document.getElementById('painel-' + aba.dataset.painel).classList.remove('hidden');
    });
});

// ==============================================
// 📑 BOLETOS
// ==============================================
async function salvarBoleto() {
    const nome = document.getElementById('bol-nome').value.trim();
    const codigo = document.getElementById('bol-codigo').value.trim();
    const valor = Number(document.getElementById('bol-valor').value);
    const data = document.getElementById('bol-data').value;
    
    if(!nome || !valor || !data) { alert('Preencha nome, valor e data!'); return; }
    
    boletos.push({ id: Date.now(), nome, codigo, valor, data, pago: false });
    
    document.getElementById('bol-nome').value = '';
    document.getElementById('bol-codigo').value = '';
    document.getElementById('bol-valor').value = '';
    document.getElementById('bol-data').value = '';
    
    await salvarNaNuvem();
}

window.marcarBoleto = async i => { boletos[i].pago = !boletos[i].pago; await salvarNaNuvem(); };
window.excluirBoleto = async i => { if(confirm('Excluir?')){ boletos.splice(i,1); await salvarNaNuvem(); } };

function montarBoletos() {
    const lista = document.getElementById('lista-boletos');
    lista.innerHTML = '';
    let v=0,a=0,p=0;
    
    boletos.forEach((b,i) => {
        const d = diasRestantes(b.data);
        let cls='', status='';
        
        if(b.pago) { cls='linha-pago'; status='✅ Pago'; p++; }
        else if(d<0) { cls='linha-atrasado'; status=`🔴 ATRASADO ${Math.abs(d)}d`; a++; }
        else if(d===0) { status='⚠️ HOJE!'; v++; }
        else { status=`${d} dias`; v++; }
        
        lista.innerHTML += `
        <div class="linha ${cls}">
            <div class="font-bold text-base">${b.nome}</div>
            <div class="text-sm mt-1">${fmtDinheiro(b.valor)} — ${fmtData(b.data)}</div>
            ${b.codigo ? `<div class="codigo-barras mt-2">📎 ${b.codigo}</div>` : ''}
            <div class="flex justify-between items-center mt-3">
                <span class="text-sm">${status}</span>
                <div>
                    <button onclick="marcarBoleto(${i})" class="text-green-400 px-3 text-lg">✓</button>
                    <button onclick="excluirBoleto(${i})" class="text-red-400 px-3 text-lg">🗑️</button>
                </div>
            </div>
        </div>`;
    });
    
    document.getElementById('b-v').textContent = v;
    document.getElementById('b-a').textContent = a;
    document.getElementById('b-p').textContent = p;
    if(boletos.length===0) lista.innerHTML = '<p class="text-slate-400 text-center py-4">Nenhum boleto</p>';
}

// ==============================================
// 📑 CHEQUES
// ==============================================
async function salvarCheque() {
    const nome = document.getElementById('che-nome').value.trim();
    const numero = document.getElementById('che-numero').value.trim();
    const valor = Number(document.getElementById('che-valor').value);
    const data = document.getElementById('che-data').value;
    
    if(!nome || !valor || !data) { alert('Preencha tudo!'); return; }
    
    cheques.push({ id: Date.now(), nome, numero, valor, data, status: 'aberto' });
    
    document.getElementById('che-nome').value = '';
    document.getElementById('che-numero').value = '';
    document.getElementById('che-valor').value = '';
    document.getElementById('che-data').value = '';
    
    await salvarNaNuvem();
}

window.marcarCheque = async i => {
    if(cheques[i].status==='aberto') cheques[i].status='pago';
    else if(cheques[i].status==='pago') cheques[i].status='dev';
    else cheques[i].status='aberto';
    await salvarNaNuvem();
};
window.excluirCheque = async i => { if(confirm('Excluir?')){ cheques.splice(i,1); await salvarNaNuvem(); } };

function montarCheques() {
    const lista = document.getElementById('lista-cheques');
    lista.innerHTML = '';
    let a=0,p=0,d=0;
    
    cheques.forEach((c,i) => {
        let cls='', status='';
        if(c.status==='pago') { cls='linha-pago'; status='✅ Compensado'; p++; }
        else if(c.status==='dev') { cls='linha-atrasado'; status='🔴 Devolvido'; d++; }
        else { cls='linha-vencer'; status='⏳ Em Aberto'; a++; }
        
        lista.innerHTML += `
        <div class="linha ${cls}">
            <div class="font-bold text-base">${c.nome}</div>
            <div class="text-sm mt-1">Nº ${c.numero} — ${fmtDinheiro(c.valor)} — ${fmtData(c.data)}</div>
            <div class="flex justify-between items-center mt-3">
                <span class="text-sm">${status}</span>
                <div>
                    <button onclick="marcarCheque(${i})" class="text-green-400 px-3 text-lg">✓</button>
                    <button onclick="excluirCheque(${i})" class="text-red-400 px-3 text-lg">🗑️</button>
                </div>
            </div>
        </div>`;
    });
    
    document.getElementById('c-a').textContent = a;
    document.getElementById('c-p').textContent = p;
    document.getElementById('c-d').textContent = d;
    if(cheques.length===0) lista.innerHTML = '<p class="text-slate-400 text-center py-4">Nenhum cheque</p>';
}

// ==============================================
// 📊 ATUALIZAR
// ==============================================
function atualizarTela() {
    if(!carregado) return;
    montarBoletos();
    montarCheques();
}

// INICIAR
carregarDaNuvem();
</script>
</body>
</html>
