<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle de Finanças ✅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body { background: #0f172a; color: #f1f5f9; font-family: system-ui, sans-serif; min-height: 100vh; margin: 0; padding: 0; }
        .aba { padding: 12px 10px; font-size: 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
        .aba.ativa { border-bottom-color: #3b82f6; color: #3b82f6; background: rgba(59,130,246,0.1); }
        .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .hidden { display: none !important; }
        input, select { width: 100%; padding: 12px; background: #334155; border: 1px solid #475569; border-radius: 8px; color: white; font-size: 16px; margin-bottom: 10px; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        .btn { padding: 12px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 16px; width: 100%; }
        .btn-azul { background: #3b82f6; color: white; }
        .btn-azul:hover { background: #2563eb; }
        .btn-verde { background: #10b981; color: white; }
        .btn-verde:hover { background: #059669; }
        .linha { padding: 12px; border-radius: 8px; margin-bottom: 8px; background: #334155/50; border-left: 4px solid; }
        .linha-pago { border-left-color: #10b981; }
        .linha-vencer { border-left-color: #f59e0b; }
        .linha-atrasado { border-left-color: #ef4444; }
        .codigo-barras { font-family: monospace; font-size: 13px; color: #94a3b8; margin-top: 4px; word-break: break-all; }
        .salvo-indicador { position: fixed; top: 10px; right: 10px; background: #10b981; color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; z-index: 100; }
        .resumo-box { text-align: center; padding: 16px; border-radius: 10px; background: #334155/50; }
    </style>
</head>
<body>

<div id="salvo-aviso" class="salvo-indicador hidden">
    <i class="fa-solid fa-check"></i> Salvo!
</div>

<header class="bg-slate-900/80 py-4 px-4 sticky top-0 z-50 border-b border-slate-700">
    <h1 class="text-xl font-bold">📋 Controle de Finanças</h1>
</header>

<main class="px-4 py-4">

    <!-- ABAS -->
    <div class="flex overflow-x-auto border-b border-slate-700 mb-4">
        <button class="aba ativa" data-painel="resumo">Resumo</button>
        <button class="aba text-slate-400" data-painel="boletos">Boletos</button>
        <button class="aba text-slate-400" data-painel="cheques">Cheques</button>
        <button class="aba text-slate-400" data-painel="lotes">Lotes</button>
        <button class="aba text-slate-400" data-painel="caixa">Caixa</button>
        <button class="aba text-slate-400" data-painel="receber">A Receber</button>
    </div>

    <!-- ========== RESUMO ========== -->
    <div id="painel-resumo" class="painel">
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="resumo-box">
                <p class="text-amber-400 text-sm">A Vencer</p>
                <p id="r-vencer" class="text-xl font-bold">0</p>
            </div>
            <div class="resumo-box">
                <p class="text-red-400 text-sm">Atrasados</p>
                <p id="r-atrasado" class="text-xl font-bold">0</p>
            </div>
            <div class="resumo-box">
                <p class="text-green-400 text-sm">Pagos</p>
                <p id="r-pago" class="text-xl font-bold">0</p>
            </div>
            <div class="resumo-box">
                <p class="text-blue-400 text-sm">Saldo Caixa</p>
                <p id="r-saldo" class="text-xl font-bold">R$0</p>
            </div>
        </div>
        <div class="card">
            <h3 class="font-bold mb-3">🔔 Próximos Vencimentos</h3>
            <div id="proximos-lista"></div>
        </div>
    </div>

    <!-- ========== BOLETOS — CÓDIGO DE BARRAS INCLUÍDO ========== -->
    <div id="painel-boletos" class="painel hidden">
        <div class="card">
            <h3 class="font-bold mb-3">➕ Novo Boleto</h3>
            <input type="text" id="bol-nome" placeholder="Nome da Empresa">
            <input type="text" id="bol-codigo" placeholder="Código de Barras ✅">
            <input type="number" step="0.01" id="bol-valor" placeholder="Valor R$">
            <input type="date" id="bol-data">
            <button class="btn btn-azul" onclick="cadastrarBoleto()">💾 Salvar Boleto</button>
        </div>

        <div class="card">
            <h3 class="font-bold mb-3">📑 Meus Boletos</h3>
            <div id="lista-boletos"></div>
        </div>
    </div>

    <!-- ========== CHEQUES ========== -->
    <div id="painel-cheques" class="painel hidden">
        <div class="card">
            <h3 class="font-bold mb-3">➕ Novo Cheque</h3>
            <input type="text" id="che-nome" placeholder="Quem deu">
            <input type="text" id="che-numero" placeholder="Número">
            <input type="number" step="0.01" id="che-valor" placeholder="Valor R$">
            <input type="date" id="che-data">
            <button class="btn btn-verde" onclick="cadastrarCheque()">💾 Salvar Cheque</button>
        </div>
        <div class="card">
            <h3 class="font-bold mb-3">📑 Meus Cheques</h3>
            <div id="lista-cheques"></div>
        </div>
    </div>

    <!-- ========== LOTES ========== -->
    <div id="painel-lotes" class="painel hidden">
        <div class="card">
            <h3 class="font-bold mb-3">➕ Novo Lote/Imóvel</h3>
            <input type="text" id="lot-nome" placeholder="Descrição">
            <input type="number" step="0.01" id="lot-valor" placeholder="Valor R$">
            <input type="number" id="lot-dia" placeholder="Dia do mês" min="1" max="31">
            <input type="text" id="lot-quem" placeholder="Quem recebe">
            <button class="btn btn-azul" onclick="cadastrarLote()">💾 Salvar Lote</button>
        </div>
        <div class="card">
            <h3 class="font-bold mb-3">📑 Meus Lotes</h3>
            <div id="lista-lotes"></div>
        </div>
    </div>

    <!-- ========== CAIXA ========== -->
    <div id="painel-caixa" class="painel hidden">
        <div class="card">
            <h3 class="font-bold mb-3">➕ Lançamento</h3>
            <input type="text" id="cx-desc" placeholder="Descrição">
            <input type="number" step="0.01" id="cx-valor" placeholder="Valor R$">
            <select id="cx-tipo">
                <option value="entrada">✅ Entrada</option>
                <option value="saida">❌ Saída</option>
            </select>
            <input type="date" id="cx-data">
            <button class="btn btn-verde" onclick="cadastrarCaixa()">💾 Salvar</button>
        </div>
        <div class="card">
            <h3 class="font-bold mb-3">💰 Movimentação</h3>
            <div id="lista-caixa"></div>
        </div>
    </div>

    <!-- ========== A RECEBER ========== -->
    <div id="painel-receber" class="painel hidden">
        <div class="card">
            <h3 class="font-bold mb-3">➕ A Receber</h3>
            <input type="text" id="rec-nome" placeholder="Quem vai pagar">
            <input type="number" step="0.01" id="rec-valor" placeholder="Valor R$">
            <input type="date" id="rec-data">
            <button class="btn btn-azul" onclick="cadastrarReceber()">💾 Salvar</button>
        </div>
        <div class="card">
            <h3 class="font-bold mb-3">📑 Contas a Receber</h3>
            <div id="lista-receber"></div>
        </div>
    </div>

</main>

<script>
// ==============================================
// BANCO DE DADOS — SALVA NO CELULAR
// ==============================================
let boletos = [];
let cheques = [];
let lotes = [];
let caixa = [];
let receber = [];

const CHAVE = 'meu_controle_2026';

// Carregar ao abrir
function carregar() {
    const salvo = localStorage.getItem(CHAVE);
    if (salvo) {
        const dados = JSON.parse(salvo);
        boletos = dados.boletos || [];
        cheques = dados.cheques || [];
        lotes = dados.lotes || [];
        caixa = dados.caixa || [];
        receber = dados.receber || [];
    }
    atualizarTela();
}

// Salvar TUDO
function salvar() {
    localStorage.setItem(CHAVE, JSON.stringify({boletos, cheques, lotes, caixa, receber}));
    const aviso = document.getElementById('salvo-aviso');
    aviso.classList.remove('hidden');
    setTimeout(() => aviso.classList.add('hidden'), 1500);
    atualizarTela();
}

// Funções auxiliares
function hoje() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function diasRestantes(dataStr) {
    const alvo = new Date(dataStr + 'T00:00:00');
    return Math.ceil((alvo - hoje()) / (1000*60*60*24));
}
function fmtDinheiro(v) { return Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
function fmtData(d) { return new Date(d+'T00:00:00').toLocaleDateString('pt-BR'); }
function dataProxDia(dia) {
    const agora = new Date();
    let v = new Date(agora.getFullYear(), agora.getMonth(), dia);
    if (v < hoje()) v = new Date(agora.getFullYear(), agora.getMonth()+1, dia);
    return v.toISOString().split('T')[0];
}

// ==============================================
// NAVEGAÇÃO
// ==============================================
document.querySelectorAll('.aba').forEach(aba => {
    aba.addEventListener('click', () => {
        document.querySelectorAll('.aba').forEach(a => { a.classList.remove('ativa'); a.classList.add('text-slate-400'); });
        aba.classList.add('ativa'); aba.classList.remove('text-slate-400');
        document.querySelectorAll('.painel').forEach(p => p.classList.add('hidden'));
        document.getElementById('painel-' + aba.dataset.painel).classList.remove('hidden');
    });
});

// ==============================================
// BOLETOS — CÓDIGO DE BARRAS SALVA E EXIBIDA ✅
// ==============================================
function cadastrarBoleto() {
    const nome = document.getElementById('bol-nome').value.trim();
    const codigo = document.getElementById('bol-codigo').value.trim();
    const valor = Number(document.getElementById('bol-valor').value);
    const data = document.getElementById('bol-data').value;
    
    if (!nome || !valor || !data) { alert('Preencha nome, valor e data!'); return; }
    
    boletos.push({ id: Date.now(), nome, codigo, valor, data, pago: false });
    
    // Limpar campos
    document.getElementById('bol-nome').value = '';
    document.getElementById('bol-codigo').value = '';
    document.getElementById('bol-valor').value = '';
    document.getElementById('bol-data').value = '';
    
    salvar();
}

function marcarBoletoPago(indice) {
    boletos[indice].pago = !boletos[indice].pago;
    salvar();
}

function excluirBoleto(indice) {
    if (confirm('Excluir esse boleto?')) {
        boletos.splice(indice, 1);
        salvar();
    }
}

function montarBoletos() {
    const lista = document.getElementById('lista-boletos');
    lista.innerHTML = '';
    
    let vencer = 0, atrasado = 0, pago = 0;
    
    boletos.forEach((b, i) => {
        const dias = diasRestantes(b.data);
        let classe = 'linha-vencer', status = '';
        
        if (b.pago) {
            classe = 'linha-pago';
            status = '✅ Pago';
            pago++;
        } else if (dias < 0) {
            classe = 'linha-atrasado';
            status = `🔴 ATRASADO ${Math.abs(dias)}d`;
            atrasado++;
        } else if (dias === 0) {
            status = '⚠️ VENCE HOJE';
            vencer++;
        } else {
            status = `${dias} dias`;
            vencer++;
        }
        
        lista.innerHTML += `
        <div class="linha ${classe}">
            <div class="font-bold">${b.nome}</div>
            <div class="text-sm">${fmtDinheiro(b.valor)} — ${fmtData(b.data)}</div>
            ${b.codigo ? `<div class="codigo-barras">📎 ${b.codigo}</div>` : ''}
            <div class="flex justify-between items-center mt-2">
                <span class="text-sm">${status}</span>
                <div>
                    <button onclick="marcarBoletoPago(${i})" class="text-green-400 px-2">✓</button>
                    <button onclick="excluirBoleto(${i})" class="text-red-400 px-2">🗑️</button>
                </div>
            </div>
        </div>`;
    });
    
    document.getElementById('r-vencer').textContent = vencer;
    document.getElementById('r-atrasado').textContent = atrasado;
    document.getElementById('r-pago').textContent = pago;
    
    if (boletos.length === 0) lista.innerHTML = '<p class="text-slate-400">Nenhum boleto cadastrado</p>';
}

// ==============================================
// CHEQUES
// ==============================================
function cadastrarCheque() {
    const nome = document.getElementById('che-nome').value.trim();
    const numero = document.getElementById('che-numero').value.trim();
    const valor = Number(document.getElementById('che-valor').value);
    const data = document.getElementById('che-data').value;
    
    if (!nome || !valor || !data) { alert('Preencha tudo!'); return; }
    
    cheques.push({ id: Date.now(), nome, numero, valor, data, pago: false });
    
    document.getElementById('che-nome').value = '';
    document.getElementById('che-numero').value = '';
    document.getElementById('che-valor').value = '';
    document.getElementById('che-data').value = '';
    
    salvar();
}

function marcarChequePago(i) { cheques[i].pago = !cheques[i].pago; salvar(); }
function excluirCheque(i) { if(confirm('Excluir?')){ cheques.splice(i,1); salvar(); } }

function montarCheques() {
    const lista = document.getElementById('lista-cheques');
    lista.innerHTML = '';
    cheques.forEach((c, i) => {
        lista.innerHTML += `
        <div class="linha ${c.pago ? 'linha-pago' : 'linha-vencer'}">
            <div class="font-bold">${c.nome}</div>
            <div class="text-sm">Nº ${c.numero} — ${fmtDinheiro(c.valor)} — ${fmtData(c.data)}</div>
            <div class="flex justify-between mt-2">
                <span>${c.pago ? '✅ Compensado' : '⏳ Em aberto'}</span>
                <div>
                    <button onclick="marcarChequePago(${i})" class="text-green-400 px-2">✓</button>
                    <button onclick="excluirCheque(${i})" class="text-red-400 px-2">🗑️</button>
                </div>
            </div>
        </div>`;
    });
    if (cheques.length === 0) lista.innerHTML = '<p class="text-slate-400">Nenhum cheque</p>';
}

// ==============================================
// LOTES
// ==============================================
function cadastrarLote() {
    const nome = document.getElementById('lot-nome').value.trim();
    const valor = Number(document.getElementById('lot-valor').value);
    const dia = Number(document.getElementById('lot-dia').value);
    const quem = document.getElementById('lot-quem').value.trim();
    
    if (!nome || !valor || !dia) { alert('Preencha nome, valor e dia!'); return; }
    
    lotes.push({ id: Date.now(), nome, valor, dia, quem, pago: false });
    
    document.getElementById('lot-nome').value = '';
    document.getElementById('lot-valor').value = '';
    document.getElementById('lot-dia').value = '';
    document.getElementById('lot-quem').value = '';
    
    salvar();
}

function marcarLotePago(i) { lotes[i].pago = !lotes[i].pago; salvar(); }
function excluirLote(i) { if(confirm('Excluir?')){ lotes.splice(i,1); salvar(); } }

function montarLotes() {
    const lista = document.getElementById('lista-lotes');
    lista.innerHTML = '';
    lotes.forEach((l, i) => {
        const proxData = dataProxDia(l.dia);
        const dias = diasRestantes(proxData);
        lista.innerHTML += `
        <div class="linha ${l.pago ? 'linha-pago' : dias<0 ? 'linha-atrasado' : 'linha-vencer'}">
            <div class="font-bold">${l.nome}</div>
            <div class="text-sm">${fmtDinheiro(l.valor)} — dia ${l.dia} — ${l.quem || ''}</div>
            <div class="flex justify-between mt-2">
                <span>${l.pago ? '✅ Pago' : dias<0 ? '🔴 Atrasado' : `${dias} dias`}</span>
                <div>
                    <button onclick="marcarLotePago(${i})" class="text-green-400 px-2">✓</button>
                    <button onclick="excluirLote(${i})" class="text-red-400 px-2">🗑️</button>
                </div>
            </div>
        </div>`;
    });
    if (lotes.length === 0) lista.innerHTML = '<p class="text-slate-400">Nenhum lote</p>';
}

// ==============================================
// CAIXA
// ==============================================
function cadastrarCaixa() {
    const desc = document.getElementById('cx-desc').value.trim();
    const valor = Number(document.getElementById('cx-valor').value);
    const tipo = document.getElementById('cx-tipo').value;
    const data = document.getElementById('cx-data').value;
    
    if (!desc || !valor || !data) { alert('Preencha tudo!'); return; }
    
    caixa.push({ id: Date.now(), desc, valor, tipo, data });
    
    document.getElementById('cx-desc').value = '';
    document.getElementById('cx-valor').value = '';
    document.getElementById('cx-data').value = '';
    
    salvar();
}

function excluirCaixa(i) { if(confirm('Excluir?')){ caixa.splice(i,1); salvar(); } }

function montarCaixa() {
    const lista = document.getElementById('lista-caixa');
    lista.innerHTML = '';
    let saldo = 0;
    caixa.forEach((c, i) => {
        if (c.tipo === 'entrada') saldo += c.valor;
        else saldo -= c.valor;
        lista.innerHTML += `
        <div class="py-2 border-b border-slate-700 flex justify-between">
            <div>
                <div class="font-medium">${c.desc}</div>
                <div class="text-xs text-slate-400">${fmtData(c.data)}</div>
            </div>
            <div class="flex items-center gap-2">
                <span class="${c.tipo==='entrada'?'text-green-400':'text-red-400'}">
                    ${c.tipo==='entrada'?'+':'-'}${fmtDinheiro(c.valor)}
                </span>
                <button onclick="excluirCaixa(${i})" class="text-red-400">🗑️</button>
            </div>
        </div>`;
    });
    document.getElementById('r-saldo').textContent = fmtDinheiro(saldo);
    if (caixa.length === 0) lista.innerHTML = '<p class="text-slate-400">Sem movimentação</p>';
}

// ==============================================
// A RECEBER
// ==============================================
function cadastrarReceber() {
    const nome = document.getElementById('rec-nome').value.trim();
    const valor = Number(document.getElementById('rec-valor').value);
    const data = document.getElementById('rec-data').value;
    
    if (!nome || !valor || !data) { alert('Preencha tudo!'); return; }
    
    receber.push({ id: Date.now(), nome, valor, data, pago: false });
    
    document.getElementById('rec-nome').value = '';
    document.getElementById('rec-valor').value = '';
    document.getElementById('rec-data').value = '';
    
    salvar();
}

function marcarReceberPago(i) { receber[i].pago = !receber[i].pago; salvar(); }
function excluirReceber(i) { if(confirm('Excluir?')){ receber.splice(i,1); salvar(); } }

function montarReceber() {
    const lista = document.getElementById('lista-receber');
    lista.innerHTML = '';
    receber.forEach((r, i) => {
        const dias = diasRestantes(r.data);
        lista.innerHTML += `
        <div class="linha ${r.pago ? 'linha-pago' : dias<0 ? 'linha-atrasado' : 'linha-vencer'}">
            <div class="font-bold">${r.nome}</div>
            <div class="text-sm">${fmtDinheiro(r.valor)} — ${fmtData(r.data)}</div>
            <div class="flex justify-between mt-2">
                <span>${r.pago ? '✅ Recebido' : dias<0 ? '🔴 Atrasado' : `${dias} dias`}</span>
                <div>
                    <button onclick="marcarReceberPago(${i})" class="text-green-400 px-2">✓</button>
                    <button onclick="excluirReceber(${i})" class="text-red-400 px-2">🗑️</button>
                </div>
            </div>
        </div>`;
    });
    if (receber.length === 0) lista.innerHTML = '<p class="text-slate-400">Nenhuma conta</p>';
}

// ==============================================
// ATUALIZAR TUDO
// ==============================================
function atualizarTela() {
    montarBoletos();
    montarCheques();
    montarLotes();
    montarCaixa();
    montarReceber();
    
    // Próximos vencimentos
    const proximos = [];
    boletos.filter(b => !b.pago).forEach(b => {
        const d = diasRestantes(b.data);
        if (d <= 7) proximos.push({nome: b.nome, valor: b.valor, data: b.data, dias: d});
    });
    lotes.filter(l => !l.pago).forEach(l => {
        const d = diasRestantes(dataProxDia(l.dia));
        if (d <= 7) proximos.push({nome: l.nome, valor: l.valor, data: dataProxDia(l.dia), dias: d});
    });
    
    const listaProx = document.getElementById('proximos-lista');
    if (proximos.length === 0) {
        listaProx.innerHTML = '<p class="text-slate-400">Nenhum vencimento próximo</p>';
    } else {
        listaProx.innerHTML = proximos.sort((a,b) => a.dias - b.dias).map(x => `
        <div class="py-2 border-b border-slate-700">
            <span class="font-bold">${x.nome}</span> — ${fmtDinheiro(x.valor)} — ${fmtData(x.data)}
            <span class="text-sm ml-2 ${x.dias<0?'text-red-400':x.dias<=1?'text-amber-400':'text-slate-400'}">
                ${x.dias<0?`ATRASADO ${Math.abs(x.dias)}d`:x.dias===0?'HOJE!':`${x.dias}d`}
            </span>
        </div>`).join('');
    }
}

// INICIAR
carregar();
</script>
</body>
</html>
